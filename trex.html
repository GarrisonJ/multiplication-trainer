<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#20302A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="T-Rex Chase">
<meta name="mobile-web-app-title" content="T-Rex Chase">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="site.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>T-rex chase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --dusk:#E8D9B8;
  --jungle:#20302A;
  --jungle-lit:#34483F;
  --scale:#4E8C5B;
  --danger:#D2552F;
  --paper:#FFFBF0;
  --ink:#16201A;
  --bone:#C9B896;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:"Space Grotesk",system-ui,sans-serif;
  background:var(--dusk);color:var(--ink);
  display:flex;justify-content:center;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
#app{
  width:100%;max-width:560px;height:100dvh;
  display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
  gap:10px;position:relative;
}

.bar{
  background:var(--jungle);color:var(--paper);
  border-radius:12px;padding:9px 11px;
  display:flex;align-items:center;justify-content:space-between;gap:7px;flex:0 0 auto;
}
.stat{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.stat span:first-child{font-size:10px;letter-spacing:.09em;color:#9DB3A5}
.stat span:last-child{font-family:"Bungee",sans-serif;font-size:clamp(15px,4.6vw,19px)}
.iconbtn{
  background:var(--jungle-lit);border:none;color:var(--paper);
  width:34px;height:34px;border-radius:9px;cursor:pointer;
  display:grid;place-items:center;flex:0 0 auto;
}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

#scene{
  flex:0 0 auto;position:relative;height:118px;
  background:linear-gradient(#C9DCC4 0 62%, #8AA97F 62% 100%);
  border-radius:12px;overflow:hidden;border-bottom:5px solid #5F7A57;
}
#sun{position:absolute;top:14px;right:22px;width:34px;height:34px;border-radius:50%;background:#F0B429;opacity:.85}
#ground{
  position:absolute;left:0;right:0;bottom:0;height:38%;
  background-image:repeating-linear-gradient(90deg,rgba(32,48,42,.22) 0 3px,transparent 3px 34px);
  animation:roll .7s linear infinite;
}
@keyframes roll{to{background-position:-34px 0}}
.sprite{position:absolute;bottom:14px;transition:left .25s linear}
.sprite svg{display:block}
#runner{animation:bob .32s ease-in-out infinite alternate}
#rex{animation:bob .42s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}

#meterwrap{flex:0 0 auto;height:9px;background:rgba(32,48,42,.16);border-radius:99px;overflow:hidden}
#meter{height:100%;width:60%;background:var(--scale);border-radius:99px;transition:width .2s linear,background .3s}

#stage{
  flex:1 1 auto;min-height:0;background:var(--paper);border-radius:16px;
  border-bottom:5px solid #E6DCC4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:10px;overflow:hidden;
}
#problem{font-family:"Bungee",sans-serif;font-size:clamp(34px,10.5vw,60px);line-height:1}
#entry{font-family:"Bungee",sans-serif;font-size:clamp(28px,8.5vw,48px);line-height:1.1;color:var(--danger);min-height:1.1em}
#note{font-size:13px;color:#6B7A70;text-align:center;min-height:18px;padding:0 6px}
.pop{animation:pop .26s ease}
@keyframes pop{45%{transform:scale(1.15)}}
.shake{animation:shake .3s}
@keyframes shake{20%{transform:translateX(-9px)}60%{transform:translateX(9px)}}

#pad{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{
  font-family:"Bungee",sans-serif;font-size:clamp(22px,6.4vw,30px);
  height:clamp(56px,10vh,80px);
  background:var(--paper);color:var(--ink);
  border:none;border-bottom:5px solid #E0D5BC;border-radius:12px;cursor:pointer;
  display:grid;place-items:center;
}
.key.util{background:var(--jungle);color:var(--paper);border-bottom-color:#14211B}
.key.util svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.key.down{transform:translateY(4px);border-bottom-width:1px;background:var(--scale);color:var(--paper)}

#overlay{
  position:absolute;inset:0;background:var(--dusk);z-index:5;
  display:flex;flex-direction:column;justify-content:center;gap:15px;
  padding:22px;overflow-y:auto;overscroll-behavior:contain;
}
#overlay h1{font-family:"Bungee",sans-serif;font-weight:400;font-size:clamp(30px,9vw,44px);line-height:.98}
#overlay h1 em{font-style:normal;display:block;color:var(--danger)}
#overlay p{font-size:14px;color:#4E5C53;max-width:34ch}
.label{font-size:11px;letter-spacing:.1em;color:#5E6D63}
#speeds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spd{
  font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:14px;
  padding:11px 0;border-radius:10px;border:none;cursor:pointer;
  background:rgba(32,48,42,.12);color:#4E5C53;border-bottom:3px solid transparent;
}
.spd.on{background:var(--danger);color:var(--paper);border-bottom-color:#A63F20}
#start{
  font-family:"Bungee",sans-serif;font-size:24px;padding:18px 0;
  background:var(--scale);color:var(--paper);
  border:none;border-bottom:6px solid #35663F;border-radius:14px;cursor:pointer;
}
#start:active{transform:translateY(4px);border-bottom-width:2px}
#report{font-size:14px;color:#4E5C53;line-height:1.55;max-width:38ch}
#report b{font-family:"Bungee",sans-serif;font-weight:400;color:var(--ink)}
.back{
  font-size:13px;color:#5E6D63;text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;align-self:flex-start;
}
.back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--danger);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){#scene{height:92px}#problem{font-size:clamp(30px,9vw,46px)}}
</style>
</head>
<body>
<div id="app">

  <div class="bar">
    <div class="stat"><span>Question</span><span id="solved">0/20</span></div>
    <div class="stat"><span>Survived</span><span id="clock">0.0</span></div>
    <div class="stat" id="beststat" style="display:none"><span>Best</span><span id="bestval">—</span></div>
    <button class="iconbtn" id="fs" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
    </button>
    <button class="iconbtn" id="mute" aria-label="Mute sound">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="wave" d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
    <button class="iconbtn" id="quit" aria-label="End run" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div id="scene">
    <div id="sun"></div>
    <div id="ground"></div>
    <div class="sprite" id="rex" style="left:8%"></div>
    <div class="sprite" id="runner" style="left:70%"></div>
  </div>

  <div id="meterwrap"><div id="meter"></div></div>

  <div id="stage">
    <div id="problem">43 × 7</div>
    <div id="entry">&nbsp;</div>
    <div id="note">Answer to keep running</div>
  </div>

  <div id="pad"></div>

  <div id="overlay">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg> All games
    </a>
    <h1>T-rex<em>chase</em></h1>
    <p>Twenty questions, two digits times one digit. Every right answer puts distance between you and the jaws. Get one wrong and it gains on you. Reach twenty and you are safe.</p>
    <div>
      <div class="label">How hungry is it</div>
      <div id="speeds" style="margin-top:7px">
        <button class="spd on" data-rate="2.4">Peckish</button>
        <button class="spd" data-rate="3.4">Hungry</button>
        <button class="spd" data-rate="4.6">Starving</button>
      </div>
    </div>
    <button id="start">Run</button>
    <div id="report"></div>
  </div>

</div>

<script>
(function(){
var el=function(i){return document.getElementById(i)};

/* ---------- pixel sprites ---------- */
function sprite(map,cell,fill,extra){
  var w=map[0].length,h=map.length,r="";
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    if(map[y][x]==="#")r+='<rect x="'+x*cell+'" y="'+y*cell+'" width="'+cell+'" height="'+cell+'" fill="'+fill+'"/>';
  }
  if(extra)r+=extra;
  return '<svg viewBox="0 0 '+w*cell+' '+h*cell+'" width="'+w*cell+'" height="'+h*cell+'" aria-hidden="true">'+r+'</svg>';
}
var REX=[
  "..........###.",
  ".........#####",
  ".........#####",
  ".........####.",
  "...#########..",
  ".############.",
  "##########.#..",
  ".#########....",
  "...####.###...",
  "...##....##...",
  "..###...###..."
];
var MAN=[
  "..###...",
  "..###...",
  ".#####..",
  "#######.",
  ".#####..",
  "..####..",
  "..##.##.",
  ".##...##",
  "###...##"
];
el("rex").innerHTML=sprite(REX,4,"#3F6B47",
  '<rect x="44" y="4" width="4" height="4" fill="#E8D9B8"/>'+
  '<rect x="40" y="16" width="16" height="3" fill="#E8D9B8"/>');
el("runner").innerHTML=sprite(MAN,4,"#20302A");

/* ---------- state ---------- */
var TOTAL=20;
var active=false,lock=false,solved=0,wrong=0,typed="",cur=null;
var gap=60,rate=2.4,baseRate=2.4,level="Peckish",t0=0,qt=0,loop=null,clockTimer=null;
var missed=[],ac=null,muted=false;
var BKEY="trex.best.v2",bests={},canSave=true;

function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(ac.state==="suspended")ac.resume();
  return ac;
}
function beep(f,d,type,vol,delay){
  if(muted)return;var c=audio();if(!c)return;
  var t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||"square";o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.003);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.02);
}
function clack(){beep(1700,0.026,"square",0.13);beep(420,0.03,"triangle",0.1)}
function ding(){beep(784,0.07,"square",0.16);beep(1175,0.12,"square",0.16,0.06)}
function growl(){beep(110,0.28,"sawtooth",0.16);beep(82,0.34,"sawtooth",0.12,0.05)}
function chomp(){
  [220,165,110,70].forEach(function(f,i){beep(f,0.22,"sawtooth",0.18,i*0.09)});
}
function cheer(){[659,784,988,1319].forEach(function(f,i){beep(f,0.17,"square",0.15,i*0.11)})}

function tap(node,fn){
  node.addEventListener("pointerdown",function(e){e.preventDefault();fn(e)});
  node.addEventListener("touchstart",function(e){e.preventDefault()},{passive:false});
}

/* ---------- best run ---------- */
function loadBest(){
  try{var raw=localStorage.getItem(BKEY);bests=raw?JSON.parse(raw):{}}
  catch(e){bests={};canSave=false}
}
function saveBest(){
  if(!canSave)return;
  try{localStorage.setItem(BKEY,JSON.stringify(bests))}catch(e){canSave=false}
}
function fmt(s){
  if(s<60)return s.toFixed(1)+"s";
  var m=Math.floor(s/60),x=Math.round(s-m*60);
  if(x===60){m++;x=0}
  return m+":"+(x<10?"0":"")+x;
}
function showBest(){
  var b=bests[level];
  if(b){
    el("beststat").style.display="";
    el("bestval").textContent=fmt(b);
  }else{
    el("beststat").style.display="none";
  }
}

/* ---------- keypad ---------- */
var keyEls={};
["1","2","3","4","5","6","7","8","9","del","0","clr"].forEach(function(k){
  var b=document.createElement("button");
  if(k==="del"){
    b.className="key util";b.setAttribute("aria-label","Backspace");
    b.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 5h11v14H9L3 12z"/><path d="M13 10l4 4M17 10l-4 4"/></svg>';
  }else if(k==="clr"){
    b.className="key util";b.setAttribute("aria-label","Clear");
    b.innerHTML='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  }else{b.className="key";b.textContent=k}
  keyEls[k]=b;tap(b,function(){press(k)});
  el("pad").appendChild(b);
});
function flash(k){
  var b=keyEls[k];if(!b)return;
  b.classList.add("down");setTimeout(function(){b.classList.remove("down")},90);
}
function press(k){
  flash(k);clack();
  if(!active||lock)return;
  if(k==="del")typed=typed.slice(0,-1);
  else if(k==="clr")typed="";
  else if(typed.length<3)typed+=k;
  el("entry").textContent=typed||"\u00a0";
  check();
}

/* ---------- problems ---------- */
function nextProblem(){
  var big=Math.floor(Math.random()*90)+10;   // 10 to 99
  var small=Math.floor(Math.random()*8)+2;   // 2 to 9
  var a=big,b=small;
  if(Math.random()<0.4){a=small;b=big}
  cur={a:a,b:b,p:big*small};
  el("problem").textContent=a+" \u00d7 "+b;
  typed="";el("entry").textContent="\u00a0";
  qt=performance.now();
}
function check(){
  if(!cur||!typed)return;
  if(parseInt(typed,10)===cur.p){
    ding();solved++;
    el("solved").textContent=solved+"/"+TOTAL;
    gap=Math.min(96,gap+16);
    rate=baseRate*(1+solved*0.015);
    var p=el("problem");p.classList.remove("pop");void p.offsetWidth;p.classList.add("pop");
    paint();
    if(solved>=TOTAL){escaped();return}
    var left=TOTAL-solved;
    el("note").textContent=left<=3?left+" to go":(gap>70?"Good distance":"Keep moving");
    nextProblem();
    return;
  }
  if(typed.length>=String(cur.p).length){
    growl();wrong++;lock=true;
    missed.push(cur.a+" \u00d7 "+cur.b+" = "+cur.p);
    gap=Math.max(0,gap-7);paint();
    el("note").textContent="It gains — "+cur.a+" \u00d7 "+cur.b+" = "+cur.p;
    var e=el("entry");e.classList.add("shake");
    setTimeout(function(){
      e.classList.remove("shake");typed="";e.textContent="\u00a0";lock=false;
      if(active)el("note").textContent="Answer to keep running";
    },900);
  }
}

/* ---------- scene ---------- */
function paint(){
  var g=Math.max(0,Math.min(96,gap));
  el("rex").style.left=(70-g*0.66)+"%";
  el("meter").style.width=g+"%";
  el("meter").style.background=g<20?"var(--danger)":g<45?"#D89A2B":"var(--scale)";
  var speed=Math.max(0.28,0.8-solved*0.012);
  el("ground").style.animationDuration=speed+"s";
}

function tick(){
  gap-=rate*0.05;
  if(gap<=0){caught();return}
  paint();
  if(gap<18&&Math.random()<0.06)beep(120,0.12,"sawtooth",0.07);
}

function caught(){
  gap=0;paint();chomp();
  end(false,"Caught on question <b>"+(solved+1)+"</b> of "+TOTAL+".");
}

function escaped(){
  el("problem").textContent="Safe";
  el("entry").textContent="\u00a0";
  el("note").textContent="You outran it";
  end(true,"");
}

function end(done,headline){
  active=false;lock=false;
  clearInterval(loop);clearInterval(clockTimer);
  var elapsed=(performance.now()-t0)/1000;
  var acc=solved+wrong?Math.round(solved/(solved+wrong)*100):0;
  var record=false,prev=bests[level];

  if(done){
    if(prev===undefined||elapsed<prev){
      record=true;bests[level]=elapsed;saveBest();
      headline="Escaped in <b>"+fmt(elapsed)+"</b> — a new best on "+level+
        (prev!==undefined?", by "+(prev-elapsed).toFixed(1)+"s.":".");
    }else{
      headline="Escaped in <b>"+fmt(elapsed)+"</b>. Your best on "+level+
        " is "+fmt(prev)+", so you were "+(elapsed-prev).toFixed(1)+"s off.";
    }
    cheer();
  }else{
    if(prev!==undefined)headline+="<br>Your best escape on "+level+" is "+fmt(prev)+".";
  }

  var list=missed.slice(-4);
  el("report").innerHTML=headline+
    "<br>"+solved+" of "+TOTAL+" answered · accuracy "+acc+"% · "+elapsed.toFixed(1)+"s"+
    (list.length?"<br><br>Ones that tripped you:<br>"+list.join("<br>"):"");
  el("start").textContent=done?"Run again":"Try again";
  el("quit").style.display="none";
  showBest();
  el("overlay").style.display="flex";
  el("overlay").scrollTop=0;
}

function start(){
  audio();clack();
  el("overlay").style.display="none";
  active=true;lock=false;
  solved=0;wrong=0;missed=[];gap=60;rate=baseRate;
  el("solved").textContent="0/"+TOTAL;
  el("clock").textContent="0.0";
  el("note").textContent="Answer to keep running";
  el("quit").style.display="";
  paint();
  t0=performance.now();
  clockTimer=setInterval(function(){
    el("clock").textContent=((performance.now()-t0)/1000).toFixed(1);
  },100);
  loop=setInterval(tick,50);
  nextProblem();
}

tap(el("start"),start);
tap(el("quit"),function(){if(active)end(false,"You stopped on question <b>"+(solved+1)+"</b> of "+TOTAL+".")});
tap(el("mute"),function(){
  muted=!muted;
  el("wave").style.display=muted?"none":"";
  el("mute").setAttribute("aria-label",muted?"Unmute sound":"Mute sound");
  if(!muted)clack();
});
Array.prototype.forEach.call(document.querySelectorAll(".spd"),function(b){
  tap(b,function(){
    Array.prototype.forEach.call(document.querySelectorAll(".spd"),function(x){x.className="spd"});
    b.className="spd on";
    baseRate=parseFloat(b.dataset.rate);
    level=b.textContent.trim();
    showBest();clack();
  });
});

if(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen){
  tap(el("fs"),function(){
    clack();var d=document,r=d.documentElement;
    if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);
    else (r.requestFullscreen||r.webkitRequestFullscreen).call(r);
  });
}else{el("fs").style.display="none"}

document.addEventListener("keydown",function(e){
  if(e.key>="0"&&e.key<="9")press(e.key);
  else if(e.key==="Backspace"){e.preventDefault();press("del")}
  else if(e.key==="Escape")press("clr");
  else if(e.key==="Enter"&&!active)start();
});
document.addEventListener("gesturestart",function(e){e.preventDefault()});

loadBest();showBest();paint();
})();
</script>
</body>
</html>
